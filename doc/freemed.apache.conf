# $Id$
# $Author$
# FreeMED Apache Configuration File
#
#	This was tested to work with Debian GNU/Linux on Apache
#	v2.0.54; your mileage may vary.

# Adjust Directory Indexes to show PHP pages first
DirectoryIndex index.php index.html index.htm index.shtml index.cgi

# PHP Associations
AddType application/x-httpd-php .php
AddType application/x-httpd-php-source .phps

Header unset Content-Security-Policy
Header add Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' 'unsafe-inline' fonts.gstatic.com"
Header unset X-Content-Security-Policy
Header add X-Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' 'unsafe-inline' fonts.gstatic.com"

# Setup FreeMED location with proper permissions, etc
Alias /freemed /usr/share/freemed
<Directory "/usr/share/freemed">
	order allow,deny
	allow from all
	# Need to have this line to allow for HTMLArea spellchecking
	# widget to have working CGI.
	AllowOverride All
	# Everything breaks if this is not enabled.
	AcceptPathInfo On
</Directory>

# ---------------------------------------------------------------------------
# Defence in depth: lib/, data/, tests/ and scripts/ are never web-readable.
#
# They hold PHP classes (lib/), SQL schema, caches, uploaded documents and the
# installer-generated lib/settings.php (data/, lib/), the test harnesses and
# their evidence (tests/) and the maintenance/gate scripts (scripts/). None of
# that is a URL: all of it is reached by include/readfile from an entrypoint,
# or from the shell.
#
# The rule lives in the SERVER CONFIGURATION on purpose, not only in the
# per-directory .htaccess files. Three measured reasons: lib/ ships NO
# .htaccess at all (lib/Makefile copies only *.php, so there was never a
# per-directory rule for it); nginx reads none of them, and every file in these
# four trees was readable there; and the .htaccess files that did exist were
# partly defeating each other (see below). The server rule also does not depend
# on AllowOverride, which is what makes it hold on a hardened vhost.
#
# Both access-control syntaxes are present and module-guarded, because this
# configuration still ships 2.2-era syntax elsewhere and has to load on either:
# `Require all denied` is 2.4 (mod_authz_core) and `Order deny,allow` is 2.2
# (mod_access_compat under 2.4).
#
# MEASURED at HEAD, before this rule. Two layouts, because the packaged install
# is served behind `Alias /freemed` while a source install is served from the
# document root; both are the same application files. Apache/2.4.68 + mod_php
# 8.3.35, nginx/1.31.6 + php-fpm 8.3.35, docroot = application root:
#   GET /lib/API.php      -> 200, empty body - mod_php EXECUTED it. nginx did
#                            the same. No .htaccess exists under lib/, so no
#                            other rule covered the tree.
#   GET /lib/settings.php -> 200, empty body - the installer's credentials file
#                            was reachable and executed. mod_php/php-fpm do not
#                            disclose its source (the file is 1459 bytes and
#                            defines DB_PASSWORD; the body was 0 bytes), so on
#                            THIS stack what the rule stops is an unauthenticated
#                            entrypoint to a file that must never be one - plus
#                            every layout where the PHP handler does not cover
#                            the path (static server, proxy, handler removed),
#                            where the same request returns the credentials.
#   GET /scripts/*.sh     -> 200 with the script's SOURCE (security-sql-
#                            concat-check.sh 3107 bytes, security-path-guard-
#                            check.sh 8563 bytes) on BOTH servers:
#                            scripts/.htaccess said `deny from *`, and `*` is
#                            not the `all` keyword - it matches no client, so
#                            the rule allowed everything it was meant to deny.
#   GET /data/store/no-image.png -> 200, 60521 bytes on Apache, even though the
#                            PARENT data/.htaccess denies the whole data/ tree.
#                            The same malformed `Deny` shape in this subtree is
#                            what let it through (data/config/.htaccess and
#                            data/schema/.htaccess, which say `deny from all`,
#                            did deny: 403).
#   GET /tests/..., /data/... -> 403 on Apache, but only because those two
#                            .htaccess files use working 2.2 `deny from all`
#                            syntax. nginx reads neither, and served
#                            tests/security/repro-relay-sqli.sh (30256 bytes),
#                            tests/security/evidence/relay-allowlist.txt
#                            (23672 bytes) and data/schema/mysql/patient.sql
#                            (14559 bytes) as source.
#   GET /help.php/../scripts/security-sql-concat-check.sh -> 200 with the
#                            script's SOURCE: a PATH_INFO segment containing
#                            `..` reaches a sibling directory, which is why the
#                            deny is stated per-directory in the server
#                            configuration rather than as a test on the request
#                            path.
# AFTER this rule every row above is 403 on both servers, on both layouts. The
# transcripts are tests/security/evidence/deployment-hardening.txt; the
# operator-facing note is doc/DEPLOYMENT_HARDENING.
# ---------------------------------------------------------------------------
<Directory "/usr/share/freemed/lib">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	# Nothing under this tree routes on PATH_INFO; do not let a request compose
	# one. AcceptPathInfo cannot be set per-<Files>, so the entrypoints that do
	# need it are scoped by the mod_rewrite rule at the end of this file.
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/data">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/tests">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/scripts">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

# ---------------------------------------------------------------------------
# PATH_INFO scope.
#
# AcceptPathInfo is On for the install root because these entrypoints route on
# the trailing path:
#
#	help.php	/help.php/<ui>/<locale>/<page>
#	chtml.php	/chtml.php/<archive>
#	relay.php	/relay.php/<provider>/<method>	(the UI's transport)
#	relay-gwt.php	/relay-gwt.php/<service>	(the GWT transport)
#	controller.php	/controller.php/<ui>/<page>	(the Dojo UI itself:
#			ui/dojo/load.php redirects to
#			controller.php/<UI>/org.freemedsoftware.ui.login, and
#			ui/dojo/view/org.freemedsoftware.ui.login.tpl builds the
#			mainframe URL the same way)
#
# Every other script is refused with 403 when it is addressed with a trailing
# path, so a file sink can only be reached through an entrypoint that is
# supposed to read PATH_INFO. install.php also reads PATH_INFO, but only to
# strip it out of REQUEST_URI for base_uri (install.php:49) - it is not a
# routing entrypoint and is deliberately not in this list.
#
# Measured, this rule is a behaviour change for exactly these shapes - at HEAD
# they were executed with the trailing path silently ignored, and they are now
# 403: /install.php/<path> -> 200 ("FreeMED is already installed!"),
# /vcalendar.php/<path> -> 401, /services/RemittCallback.php/<path> -> 200.
# None of the three routes on PATH_INFO (checked: no $_SERVER['PATH_INFO'] on
# any of them), the plain URLs are unaffected, and the trailing-path form has
# never been a documented interface. The one shape that does matter -
# RemittCallback's WSDL fetch, /services/RemittCallback.php?wsdl - is
# unchanged (200, verified after this rule).
#
# This is done with mod_rewrite because AcceptPathInfo is a directory-context
# directive and cannot be set per-<Files>. It is inside the install-root
# <Directory> so that it cannot affect any other application on the same
# server, and module-guarded so that a server without mod_rewrite skips it
# rather than failing to start; the four deny blocks above do not depend on it.
#
# MEASURED after this rule (packaged /freemed layout and docroot layout alike):
#   /help.php/<ui>/<locale>/<page>      401 (its own auth gate; PATH_INFO reached it)
#   /chtml.php/main                     200
#   /relay.php/json/<method>            200
#   /relay-gwt.php/<service>            200
#   /controller.php/<ui>/<page>         200
#   /index.php/<path>                   403      (was 302)
#   /vcalendar.php/<path>               403      (was 401)
#   /install.php/<path>                 403      (was 200)
#   /services/RemittCallback.php/<path> 403      (was 200)
#   /services/RemittCallback.php?wsdl   200      (unchanged)
# ---------------------------------------------------------------------------
<Directory "/usr/share/freemed">
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteCond %{REQUEST_URI} \.php/
		RewriteCond %{REQUEST_URI} !/(help|chtml|relay|relay-gwt|controller)\.php/
		RewriteRule ^ - [F]
	</IfModule>
</Directory>
