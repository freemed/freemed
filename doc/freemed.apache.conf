# $Id$
# $Author$
# FreeMED Apache Configuration File
#
#	This was tested to work with Debian GNU/Linux on Apache
#	v2.0.54; your mileage may vary.

# Adjust Directory Indexes to show PHP pages first
DirectoryIndex index.php index.html index.htm index.shtml index.cgi

# PHP Associations
AddType application/x-httpd-php .php
AddType application/x-httpd-php-source .phps

Header unset Content-Security-Policy
Header add Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' 'unsafe-inline' fonts.gstatic.com"
Header unset X-Content-Security-Policy
Header add X-Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' 'unsafe-inline' fonts.gstatic.com"

# Setup FreeMED location with proper permissions, etc
Alias /freemed /usr/share/freemed
<Directory "/usr/share/freemed">
	order allow,deny
	allow from all
	# Need to have this line to allow for HTMLArea spellchecking
	# widget to have working CGI.
	AllowOverride All
	# Everything breaks if this is not enabled.
	AcceptPathInfo On
</Directory>

# ---------------------------------------------------------------------------
# Defence in depth: lib/, data/, tests/ and scripts/ are never web-readable.
#
# They hold PHP classes (lib/), SQL schema, caches, uploaded documents and the
# installer-generated lib/settings.php (data/, lib/), the test harnesses and
# their evidence (tests/) and the maintenance/gate scripts (scripts/). None of
# that is a URL: all of it is reached by include/readfile from an entrypoint,
# or from the shell.
#
# The rule lives in the SERVER CONFIGURATION on purpose, not only in the
# per-directory .htaccess files. Three measured reasons: lib/ ships NO
# .htaccess at all (lib/Makefile copies only *.php, so there was never a
# per-directory rule for it); nginx reads none of them, and every file in these
# four trees was readable there; and the .htaccess files that did exist were
# partly defeating each other (see below). The server rule also does not depend
# on AllowOverride, which is what makes it hold on a hardened vhost.
#
# Both access-control syntaxes are present and module-guarded, because this
# configuration still ships 2.2-era syntax elsewhere and has to load on either:
# `Require all denied` is 2.4 (mod_authz_core) and `Order deny,allow` is 2.2
# (mod_access_compat under 2.4).
#
# THE MEASURED ROWS ARE NOT RESTATED HERE. Every before/after row for these four
# trees - status, byte count, and whether a file was executed or served as
# source - on Apache/2.4.68 + mod_php 8.3.35 and nginx/1.31.6 + php-fpm 8.3.35,
# on the packaged `Alias /freemed` layout and on a docroot install, is in
# tests/security/evidence/deployment-hardening.txt: PHASE A is the unhardened
# state and PHASE B the state with these rules installed. That file is the one
# copy of the matrix, and the comments in docker/nginx.conf and the prose in
# doc/DEPLOYMENT_HARDENING sections 1-3 and 6 point at it too. What the reasons
# above need kept is their SHAPE rather than a second copy of the numbers:
# lib/ shipped NO .htaccess at all (so no per-directory rule ever covered the
# tree); nginx reads none of them, so the source of every file in these trees
# was served there; four of the files that did exist said `<Files *> deny from
# *`, and `*` is not the `all` keyword a Deny takes, so those rules allowed
# everything they were meant to deny (that is how /scripts/*.sh served source,
# and how data/store/ took itself out of its parent's denial); and five more
# carried 2.2-only order/deny syntax.
# ---------------------------------------------------------------------------
<Directory "/usr/share/freemed/lib">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	# Nothing under this tree routes on PATH_INFO; do not let a request compose
	# one. AcceptPathInfo cannot be set per-<Files>, so the entrypoints that do
	# need it are scoped by the mod_rewrite rule at the end of this file.
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/data">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/tests">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

<Directory "/usr/share/freemed/scripts">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		order deny,allow
		deny from all
	</IfModule>
	AcceptPathInfo Off
</Directory>

# ---------------------------------------------------------------------------
# PATH_INFO scope.
#
# AcceptPathInfo is On for the install root because these entrypoints route on
# the trailing path:
#
#	help.php	/help.php/<ui>/<locale>/<page>
#	chtml.php	/chtml.php/<archive>
#	relay.php	/relay.php/<provider>/<method>	(the UI's transport)
#	relay-gwt.php	/relay-gwt.php/<service>	(the GWT transport)
#	controller.php	/controller.php/<ui>/<page>	(the Dojo UI itself:
#			ui/dojo/load.php redirects to
#			controller.php/<UI>/org.freemedsoftware.ui.login, and
#			ui/dojo/view/org.freemedsoftware.ui.login.tpl builds the
#			mainframe URL the same way)
#
# Every other script is refused with 403 when it is addressed with a trailing
# path, so a file sink can only be reached through an entrypoint that is
# supposed to read PATH_INFO. install.php also reads PATH_INFO, but only to
# strip it out of REQUEST_URI for base_uri (install.php:49) - it is not a
# routing entrypoint and is deliberately not in this list.
#
# The allowlist is ANCHORED to the request root, and that part is load-bearing.
# Task 4.1 shipped it as an unanchored substring test on %{REQUEST_URI}
# (`!/(help|chtml|relay|relay-gwt|controller)\.php/`), so any URI that contained
# an allowlisted `name.php/` ANYWHERE escaped the [F] and kept running the real
# script before it with PATH_INFO. Anchoring fixes it; the before/after matrix
# for that defect is tests/security/evidence/deployment-hardening.txt PHASE F1
# (six shapes, both shipped layouts, both servers) and is not restated here. The
# rule below is expressed as the RewriteRule PATTERN rather than as a test on
# %{REQUEST_URI}, because in per-directory context the pattern is
# matched against the request path relative to this <Directory> (the per-dir
# prefix is stripped). That anchors it to the request root on BOTH shipped
# layouts - the `/freemed` Alias and a docroot install - and on any other Alias
# an operator points at this tree, none of which a hardcoded
# `^/(freemed/)?...` prefix would survive.
#
# Measured, this rule is a behaviour change for exactly four shapes - at HEAD
# they were executed with the trailing path silently ignored, and they are now
# 403: /install.php/<path>, /index.php/<path>, /vcalendar.php/<path> and
# /services/RemittCallback.php/<path>. None of the four routes on PATH_INFO
# (checked: no $_SERVER['PATH_INFO'] on any of them), the plain URLs are
# unaffected, and the trailing-path form has never been a documented interface.
# The one shape that does matter - RemittCallback's WSDL fetch,
# /services/RemittCallback.php?wsdl - is unchanged. The measured status pair for
# each of the four, and the row for every entrypoint below, is
# tests/security/evidence/deployment-hardening.txt PHASE E; neither is restated
# here.
#
# This is done with mod_rewrite because AcceptPathInfo is a directory-context
# directive and cannot be set per-<Files>. It is inside the install-root
# <Directory> so that it cannot affect any other application on the same
# server, and module-guarded so that a server without mod_rewrite skips it
# rather than failing to start; the four deny blocks above do not depend on it.
# THE CONSEQUENCE OF THAT GUARD IS FAIL-OPEN AND BELONGS HERE: with mod_rewrite
# absent the PATH_INFO scope is OFF ENTIRELY - every /<script>.php/<path> answers
# as it did before this file - while the four deny blocks survive, because they
# are <Directory> rules and need no module. The five entrypoints listed above
# keep working either way: they are the reason AcceptPathInfo is On.
# ---------------------------------------------------------------------------
<Directory "/usr/share/freemed">
	<IfModule mod_rewrite.c>
		RewriteEngine On
		# `(?!...)` is a PCRE lookahead: refuse any request whose path relative
		# to this directory contains `.php/` and does NOT START with one of the
		# five entrypoints. The pattern is per-directory-relative, so it is
		# anchored at the request root (see the note above).
		RewriteRule ^(?!(help|chtml|relay|relay-gwt|controller)\.php/).*\.php/ - [F]
	</IfModule>
</Directory>
