events {
  worker_connections  768;
}

http {
  include  /etc/nginx/mime.types;
  default_type  application/octet-stream;

  charset  utf-8;

  gzip  on;
  gzip_disable  "msie6";
  client_max_body_size 10000M;

  #Added to increase timeout to prevent 504 error
  fastcgi_read_timeout 900;
  fastcgi_send_timeout 900;
  proxy_read_timeout 900;
  send_timeout 900;
  proxy_connect_timeout 900;

  # PATH_INFO scope. nginx hands PATH_INFO to php-fpm for ANY .php the request
  # path points at, so the entrypoints that actually route on it have to be
  # named. 0 = allow, 1 = refuse. The allowlist pattern must be FIRST: nginx
  # stops at the first matching regular expression.
  #
  #   help.php        /help.php/<ui>/<locale>/<page>
  #   chtml.php       /chtml.php/<archive>
  #   relay.php       /relay.php/<provider>/<method>   (the UI's transport)
  #   relay-gwt.php   /relay-gwt.php/<service>         (the GWT transport)
  #   controller.php  /controller.php/<ui>/<page>      (the Dojo UI itself)
  #
  # The allowlist is ANCHORED to the request root (`~^/(freemed/)?...`), and
  # that part is load-bearing. Task 4.1 shipped it unanchored
  # (`~(help|chtml|relay|relay-gwt|controller)\\.php/`), i.e. as a substring
  # test on $uri, so any request that contained an allowlisted `name.php/`
  # ANYWHERE matched this first entry and was handed to php-fpm as though it
  # were an entrypoint - exactly the class the entry below exists to refuse.
  # With the anchor, only a path that STARTS with one of the five (optionally
  # behind the /freemed/ prefix) is exempt. The before/after matrix for that
  # defect is tests/security/evidence/deployment-hardening.txt PHASE F1 and is
  # not restated here.
  #
  # The anchor names the /freemed/ segment because on this server the
  # application is served under it (`root /usr/share;` above). The Apache
  # equivalent needs no such name - it is matched per-directory and is
  # therefore anchored to the request root whatever the mount prefix is (see
  # doc/freemed.apache.conf). An installation served under a different prefix
  # has to add that prefix here, the same way it has to add the location block.
  map $uri $freemed_refuse_pathinfo {
    default 0;
    "~^/(freemed/)?(help|chtml|relay|relay-gwt|controller)\\.php/" 0;
    "~\\.php/" 1;
  }

  server {
    listen  0.0.0.0:80;
    server_name  freemed;
    proxy_redirect    off;

    root   /usr/share;
    index  index.php;

    location /freemed {
    }

    # Defence in depth: lib/, data/, tests/ and scripts/ are never
    # web-readable. They hold PHP classes (lib/), SQL schema, caches, uploaded
    # documents and the installer-generated lib/settings.php (data/, lib/), the
    # test harnesses (tests/) and the maintenance/gate scripts (scripts/).
    #
    # nginx reads no .htaccess, so this is the only place the rule can live for
    # this server; the Apache equivalent is in doc/freemed.apache.conf.
    #
    # This regex location MUST stay ahead of the PHP location below: nginx uses
    # the FIRST matching regex location, so with this rule first a request for
    # /freemed/lib/API.php - or /freemed/lib/API.php/<anything> - is denied
    # instead of being handed to php-fpm. The optional /freemed/ segment covers
    # both this alias and an install served from the document root.
    #
    # It matches the DECODED, normalised $uri, which is what makes it hold
    # against the variants measured on this stack: /lib%2FAPI.php (nginx decodes
    # the %2F, so the regex sees /lib/API.php), //lib/API.php and /./lib/API.php
    # (slash merging), /lib/API.php/../API.php, /scripts/<script>/. and
    # /help.php/../scripts/<script> (a PATH_INFO `..` segment).
    #
    # THE MEASURED ROWS ARE NOT RESTATED HERE. Every before/after row for this
    # rule - status, byte count and whether a file was executed or served as
    # source, on this server and on Apache, on the alias and the docroot layouts
    # - is in tests/security/evidence/deployment-hardening.txt, PHASE A (before
    # this rule) and PHASE B (with the shipped rules installed). That file is the
    # one copy of the matrix; the comments in doc/freemed.apache.conf and the
    # prose in doc/DEPLOYMENT_HARDENING sections 1-3 and 6 point at it too. Only
    # the SHAPE of the reason is kept here: before this rule every file in these
    # four trees was readable on this server - executed under php-fpm, or served
    # as source.
    location ~ ^/(freemed/)?(lib|data|tests|scripts)(/|$) {
      deny all;
    }

    location ~ [^/]\.php(/|$) {
      # A script addressed with a trailing path has PATH_INFO, and only the
      # entrypoints mapped above are allowed to have one.
      if ($freemed_refuse_pathinfo) {
        return 403;
      }
      fastcgi_split_path_info  ^(.+\.php)(/.+)$;
      fastcgi_index index.php;
      include   fastcgi_params;
      fastcgi_param   PATH_INFO       $fastcgi_path_info;
      fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass    freemed:9000;
      include fastcgi.conf;
    }

  }
}
