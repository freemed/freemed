events {
  worker_connections  768;
}

http {
  include  /etc/nginx/mime.types;
  default_type  application/octet-stream;

  charset  utf-8;

  gzip  on;
  gzip_disable  "msie6";
  client_max_body_size 10000M;

  #Added to increase timeout to prevent 504 error
  fastcgi_read_timeout 900;
  fastcgi_send_timeout 900;
  proxy_read_timeout 900;
  send_timeout 900;
  proxy_connect_timeout 900;

  # PATH_INFO scope. nginx hands PATH_INFO to php-fpm for ANY .php the request
  # path points at, so the entrypoints that actually route on it have to be
  # named. 0 = allow, 1 = refuse. The allowlist pattern must be FIRST: nginx
  # stops at the first matching regular expression.
  #
  #   help.php        /help.php/<ui>/<locale>/<page>
  #   chtml.php       /chtml.php/<archive>
  #   relay.php       /relay.php/<provider>/<method>   (the UI's transport)
  #   relay-gwt.php   /relay-gwt.php/<service>         (the GWT transport)
  #   controller.php  /controller.php/<ui>/<page>      (the Dojo UI itself)
  map $uri $freemed_refuse_pathinfo {
    default 0;
    "~(help|chtml|relay|relay-gwt|controller)\.php/" 0;
    "~\.php/" 1;
  }

  server {
    listen  0.0.0.0:80;
    server_name  freemed;
    proxy_redirect    off;

    root   /usr/share;
    index  index.php;

    location /freemed {
    }

    # Defence in depth: lib/, data/, tests/ and scripts/ are never
    # web-readable. They hold PHP classes (lib/), SQL schema, caches, uploaded
    # documents and the installer-generated lib/settings.php (data/, lib/), the
    # test harnesses (tests/) and the maintenance/gate scripts (scripts/).
    #
    # nginx reads no .htaccess, so this is the only place the rule can live for
    # this server; the Apache equivalent is in doc/freemed.apache.conf.
    #
    # This regex location MUST stay ahead of the PHP location below: nginx uses
    # the FIRST matching regex location, so with this rule first a request for
    # /freemed/lib/API.php - or /freemed/lib/API.php/<anything> - is denied
    # instead of being handed to php-fpm. The optional /freemed/ segment covers
    # both this alias and an install served from the document root.
    #
    # It matches the DECODED, normalised $uri, which is what makes it hold
    # against the variants measured on this stack: /lib%2FAPI.php (nginx decodes
    # the %2F, so the regex sees /lib/API.php - at HEAD php-fpm EXECUTED it:
    # 200, 0 bytes), //lib/API.php and /./lib/API.php (slash merging),
    # /lib/API.php/../API.php, /scripts/<script>/. and
    # /help.php/../scripts/<script> (a PATH_INFO `..` segment, which served the
    # script source at HEAD: 200, 3107 bytes).
    #
    # MEASURED at HEAD, before this rule: /lib/API.php 200 (executed),
    # /lib/settings.php 200 (executed; the installer's credentials file - the
    # body is empty, the source is not disclosed, but the file is reachable and
    # executed), /data/schema/mysql/patient.sql 200 as SOURCE (14559 bytes),
    # /tests/security/repro-relay-sqli.sh 200 as SOURCE (30256 bytes),
    # /scripts/security-sql-concat-check.sh 200 as SOURCE (3107 bytes),
    # /data/store/no-image.png 200 (60521 bytes). After this rule all of them
    # are 403 - on this alias layout and on a docroot install.
    location ~ ^/(freemed/)?(lib|data|tests|scripts)(/|$) {
      deny all;
    }

    location ~ [^/]\.php(/|$) {
      # A script addressed with a trailing path has PATH_INFO, and only the
      # entrypoints mapped above are allowed to have one.
      if ($freemed_refuse_pathinfo) {
        return 403;
      }
      fastcgi_split_path_info  ^(.+\.php)(/.+)$;
      fastcgi_index index.php;
      include   fastcgi_params;
      fastcgi_param   PATH_INFO       $fastcgi_path_info;
      fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass    freemed:9000;
      include fastcgi.conf;
    }

  }
}
