; FreeMED runtime PHP settings (container layout).
;
; WHERE THIS FILE IS READ: docker/docker-compose.yml mounts it at
;   /usr/local/etc/php/conf.d/zz-freemed.ini
; which is the scanned drop-in directory of the image built by
; docker/Dockerfile (PHP_INI_DIR=/usr/local/etc/php). It used to be mounted at
; /opt/bitnami/php/etc/conf.d/custom.ini, a path the formerly-used image did
; not have, so PHP never read it and every line here was inert - measured and
; recorded in doc/PHP2SHELL_AUDIT section 3.1. Verify with `php --ini` and
; `php -i` INSIDE the running container, never from the compose file.
;
; A host or Debian installation that runs its own php.ini must carry the two
; PHP2SHELL lines below itself; this file covers the container only.

; ---------------------------------------------------------------------------
; PHP2SHELL (CVE-2026-109618, CVE-2026-109619) - STOPGAP CONTROLS, NOT THE FIX
;
; The fix is the interpreter version: docker/Dockerfile pins PHP 8.3.36, the
; first 8.3 release carrying both fixes, and fails the build if the runtime
; drops below it. These settings are the vendor-published mitigations and are
; shipped for hosts that cannot move the interpreter on the same day. Neither
; one is complete protection; both must be in configuration that is loaded
; BEFORE the request is parsed, and every worker must be restarted after a
; change (php-fpm reads its ini at process start).
;
; CVE-2026-109619 (stale request-owned state reused by a later request on the
; same worker). The exploitable upload path needs session upload-progress
; tracking, which PHP enables by default and which runs even when a script
; never calls session_start(). This application calls it on every request
; (lib/freemed.php) and has four $_FILES modules, so turn the feature off.
session.upload_progress.enabled = Off
; PHP 8.5 only: a shutdown diagnostic can recreate the same stale state. The
; directive is ignored (not an error) on 8.3, so it ships unconditionally.
fatal_error_backtraces = 0
;
; CVE-2026-109618 (cleanup after an allocation failure during form parsing).
; Guidance is to make the allocation failure hard to reach rather than to cap
; memory: a large memory_limit and a deliberately bounded decoded body.
;   * post_max_size is PHP's own cap on a decoded body and it is set EXPLICITLY
;     here at 64M, which is the size the application itself asks for: the
;     bootstrap in lib/freemed.php raises post_max_size to 64M when it is lower,
;     but that call is a no-op at request time (post_max_size is PHP_INI_PERDIR -
;     the body has already been parsed), so this line is the one that decides.
;     docker/nginx.conf caps the same body at 64M one layer earlier; keep the two
;     equal, and raise them together with a documented reason (DICOM or bulk
;     document upload). A larger window is a larger CVE-2026-109618 surface.
;   * memory_limit is deliberately large; php-fpm workers are additionally
;     bounded by the container, which is the limit that should bite first.
post_max_size = 64M
memory_limit = 2048M
;
; NOT a mitigation, corrected for honesty: the old line here was
; "max_file_uploads = 128M". max_file_uploads is a COUNT of files per request,
; so the M suffix was being read as 134217728. 128 is what the line meant.
max_file_uploads = 128
max_input_vars = 10000
; The old "php_value[memory_limit] = 2048M" line was Apache mod_php *config*
; syntax pasted into an ini file; PHP ignores it. Removed rather than kept as
; decoration. It is the memory_limit line above that has effect.

; ---------------------------------------------------------------------------
; register_argc_argv (CWE-16). PHP's compiled default for this setting is On.
; Without the line below, every web request WITH a query string looks like a
; command line to any script that guards on $_SERVER['argc'] / $_SERVER['argv']:
; the request halts with an empty 200 instead of running. That masking is what
; made the old vCalendar CLI guard swallow every query-string request
; (vcalendar.php now tests PHP_SAPI instead, which no ini setting can move), and
; it is the trap for anything else that copies the idiom.
;
; MEASURED with this file mounted as a conf.d drop-in, php 8.3.35, web SAPI
; (cli-server), request /argv.php?physician=1:
;   not mounted  register_argc_argv=On   argc=1 argv=["physician=1"]  guard halts
;   mounted      register_argc_argv=Off  argc/argv UNSET              guard runs
; The directive is valid and effective for the web SAPIs (mod_php, php-fpm,
; cli-server). The CLI SAPI reports it On whatever this file says (measured with
; this file loaded: SAPI=cli, register_argc_argv='1', $argv set), so nothing in
; this tree may rely on this setting for CLI behaviour.
; See doc/DEPLOYMENT_HARDENING section 5 and doc/PHP2SHELL_AUDIT section 6.
register_argc_argv = Off
