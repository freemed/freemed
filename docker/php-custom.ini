max_file_uploads = 128M
max_input_vars = 10000
memory_limit = 2048M
php_value[memory_limit] = 2048M

; register_argc_argv (CWE-16). PHP's compiled default for this setting is On:
; the php:8.3 images this tree is served from activate no php.ini at all
; (measured: `php --ini` -> "Loaded Configuration File: (none)";
; php.ini-development and php.ini-production are present and inert), and a
; conf.d drop-in is also how docker/docker-compose.yml mounts this file
; (/opt/bitnami/php/etc/conf.d/custom.ini). So without the line below, every web
; request WITH a query string looks like a command line to any script that
; guards on $_SERVER['argc'] / $_SERVER['argv']: the request halts with an empty
; 200 instead of running. That masking is what made the old vCalendar CLI guard
; swallow every query-string request (vcalendar.php now tests PHP_SAPI instead,
; which no ini setting can move), and it is the trap for anything else that
; copies the idiom.
;
; MEASURED with this exact file mounted as a conf.d drop-in, php 8.3.35, web
; SAPI (cli-server), request /argv.php?physician=1:
;   not mounted  register_argc_argv=On   argc=1 argv=["physician=1"]  guard halts
;   mounted      register_argc_argv=Off  argc/argv UNSET              guard runs
; The directive is valid and effective for the web SAPIs (mod_php, php-fpm,
; cli-server). The CLI SAPI reports it On whatever this file says (measured with
; this file loaded: SAPI=cli, register_argc_argv='1', $argv set), so nothing in
; this tree may rely on this setting for CLI behaviour.
; See doc/DEPLOYMENT_HARDENING.
register_argc_argv = Off
