max_file_uploads = 128M
max_input_vars = 10000
memory_limit = 2048M
php_value[memory_limit] = 2048M

; register_argc_argv (CWE-16). PHP's compiled default for this setting is On.
; Without the line below, every web request WITH a query string looks like a
; command line to any script that guards on $_SERVER['argc'] / $_SERVER['argv']:
; the request halts with an empty 200 instead of running. That masking is what
; made the old vCalendar CLI guard swallow every query-string request
; (vcalendar.php now tests PHP_SAPI instead, which no ini setting can move), and
; it is the trap for anything else that copies the idiom.
;
; PROVENANCE OF THE MEASUREMENT, stated exactly because an ini setting is a
; guarantee only where the file is read. The numbers below come from the
; VERIFICATION image (freemed-verify-php:apache, built FROM php:8.3-apache for
; this project's throwaway harness, drop-ins read from
; /usr/local/etc/php/conf.d/), NOT from the image docker/docker-compose.yml
; ships: that one is jbuchbinder/moodle-php-8.3-fpm (Bitnami layout, this file
; mounted at /opt/bitnami/php/etc/conf.d/custom.ini) and it was not available to
; inspect. The drop-in mount predates this change and carries settings the
; deployment already uses (memory_limit, max_input_vars), so the mechanism is in
; use - but a Bitnami image or a php.ini-production install normally loads a
; php.ini that ALREADY sets register_argc_argv = Off (in the verification image,
; php.ini-production:690 and php.ini-development:688 both say so), so on those
; layouts this line may be repeating the effective default rather than
; establishing it. It is still the right line to ship: where the file is read an
; explicit Off wins, and it is the half of the pair that is verifiable in the
; layout this tree can build.
;
; MEASURED with this exact file mounted as a conf.d drop-in, php 8.3.35, web
; SAPI (cli-server), request /argv.php?physician=1:
;   not mounted  register_argc_argv=On   argc=1 argv=["physician=1"]  guard halts
;   mounted      register_argc_argv=Off  argc/argv UNSET              guard runs
; The directive is valid and effective for the web SAPIs (mod_php, php-fpm,
; cli-server). The CLI SAPI reports it On whatever this file says (measured with
; this file loaded: SAPI=cli, register_argc_argv='1', $argv set), so nothing in
; this tree may rely on this setting for CLI behaviour.
; See doc/DEPLOYMENT_HARDENING.
register_argc_argv = Off
